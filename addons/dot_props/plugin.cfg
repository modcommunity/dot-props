[plugin]

name="dot-props"
description="A sandbox layer: a catalogue of spawnable props, per-player limits and an undo stack, and the tools that move them — a physics gun that holds, rotates and freezes, and a gravity gun that picks up and punts. Server-authoritative, because rigid-body physics is not reproducible across machines."
author="dot"
version="0.1.0"
script="dot_props_plugin.gd"
